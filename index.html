<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <title>Tabu</title>
  <link rel="stylesheet" href="style.css">
  <script src="cards.js"></script>
  <script src="app.js" defer></script>
</head>
<body>

  <!-- 🚀 Açılış Ekranı -->
  <div id="splash-screen" class="splash">
    <h1 class="title-text splash-title">TABU</h1>
    <div class="splash-bar-container"><div class="splash-bar-fill"></div></div>
  </div>

  <!-- ⏱️ Geri Sayım -->
  <div id="countdown-overlay" class="overlay hidden">
    <span id="countdown-team-title" class="countdown-title"></span>
    <div id="countdown-number" class="countdown-number">3</div>
  </div>

  <!-- ✏️ Kelime Düzenleme Modalı -->
  <div id="edit-modal" class="overlay hidden">
    <div class="panel edit-panel">
      <h3 class="edit-title">Kelimeyi Düzenle</h3>
      <p id="edit-word-display" class="edit-word-name"></p>
      <div class="edit-actions">
        <button class="btn btn-correct" data-status="correct">
          <span>Doğru (+1)</span>
        </button>
        <button class="btn btn-tabu" data-status="tabu">
          <span>Tabu (-1)</span>
        </button>
        <button class="btn btn-pass" data-status="pass">
          <span>Pas (0)</span>
        </button>
      </div>
      <button id="btn-close-edit" class="btn btn-secondary mt-2">İptal</button>
    </div>
  </div>

  <div id="app">
    
    <!-- ⚙️ Ayarlar -->
    <div id="screen-setup" class="screen">
      <div class="header-center"><h1 class="title-text">TABU</h1></div>
      <div class="panel form-panel">
        <div class="panel-title">OYUN AYARLARI</div>
        <div class="form-group"><label>1. Takım Adı</label><input type="text" id="team1-name" value="Kırmızı Takım"></div>
        <div class="form-group"><label>2. Takım Adı</label><input type="text" id="team2-name" value="Mavi Takım"></div>
        <div class="form-group">
          <div class="flex-between"><label>Tur Süresi</label><span id="time-val" class="highlight-val">60 sn</span></div>
          <input type="range" id="input-time" min="30" max="120" step="15" value="60">
        </div>
        <div class="form-group">
          <div class="flex-between"><label>Toplam Tur Sayısı</label><span id="rounds-val" class="highlight-val">3 Tur</span></div>
          <input type="range" id="input-rounds" min="1" max="20" step="1" value="3">
        </div>
        <div class="form-group">
          <div class="flex-between"><label>Tabu Ceza Puanı</label><span id="tabu-penalty-val" class="danger-val">-1 Puan</span></div>
          <input type="range" id="input-tabu-penalty" class="range-red" min="1" max="5" step="1" value="1">
        </div>
        <div class="form-group">
          <div class="flex-between"><label>Her Turdaki Pas Hakkı</label><span id="pass-limit-val" class="highlight-val">3 Pas</span></div>
          <input type="range" id="input-pass-limit" min="0" max="10" step="1" value="3">
        </div>
      </div>
      <button id="btn-start-game" class="btn btn-primary mt-2">Oyunu Başlat</button>
    </div>

    <!-- 🚩 Tur Hazırlık -->
    <div id="screen-ready" class="screen hidden">
      <div class="text-center mt-2">
        <span id="ready-round-badge" class="badge-round">Tur 1 / 3</span>
        <h2 id="ready-team-name" class="team-title mt-2"></h2>
      </div>
      <div class="score-grid my-auto">
        <div class="panel score-box team-red"><p id="ready-score-team1-label" class="score-label"></p><p id="ready-score-team1" class="score-val">0</p></div>
        <div class="panel score-box team-blue"><p id="ready-score-team2-label" class="score-label"></p><p id="ready-score-team2" class="score-val">0</p></div>
      </div>
      <button id="btn-start-turn" class="btn btn-green">Süreyi Başlat</button>
    </div>

    <!-- 🎴 Aktif Oyun -->
    <div id="screen-play" class="screen hidden">
      <div class="panel top-bar">
        <div class="flex-center gap-2"><span class="team-dot"></span><span id="play-team-name" class="team-name truncate"></span></div>
        <div class="flex-center gap-2">
          <button id="btn-pause" class="btn-icon" aria-label="Oyunu Duraklat">⏸️</button>
          <div class="timer-box">
            <svg class="timer-svg" viewBox="0 0 96 42">
              <rect x="2" y="2" width="92" height="38" rx="12" ry="12" class="timer-bg" />
              <rect id="timer-border" x="2" y="2" width="92" height="38" rx="12" ry="12" class="timer-fill" />
            </svg>
            <span id="play-timer" class="timer-text">60</span>
          </div>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-box stat-correct">Doğru: <span id="stat-correct">0</span></div>
        <div class="stat-box stat-tabu">Tabu: <span id="stat-tabu">0</span></div>
        <div class="stat-box stat-pass">Pas: <span id="stat-pass">3</span></div>
      </div>

      <div class="card-area">
        <div id="pause-overlay" class="overlay absolute-overlay hidden">
          <h3 class="pause-title">Oyun Durduruldu</h3>
          <div class="pause-actions">
            <button id="btn-resume" class="btn btn-green">Devam Et</button>
            <button id="btn-main-menu" class="btn btn-secondary">Ana Menü</button>
          </div>
        </div>
        <div id="card-card" class="panel card-main">
          <div class="card-header"><button id="btn-undo" class="btn-undo disabled" aria-label="Geri Al">↩ Geri Al</button></div>
          <div class="card-word-box"><h2 id="card-word" class="card-word"></h2></div>
          <div id="card-forbidden" class="card-forbidden-list"></div>
        </div>
      </div>

      <div class="actions-grid">
        <button id="btn-tabu" class="btn-action btn-tabu">
          <span class="action-icon">❌</span><span id="label-tabu-btn">TABU (-1)</span>
        </button>
        <button id="btn-pass" class="btn-action btn-pass">
          <span class="action-icon">⏭️</span><span id="label-pass-btn">PAS (3)</span>
        </button>
        <button id="btn-correct" class="btn-action btn-correct">
          <span class="action-icon">✅</span><span>DOĞRU (+1)</span>
        </button>
      </div>
    </div>

    <!-- 📊 Tur Özet (Düzenlenebilir) -->
    <div id="screen-summary" class="screen hidden">
      <div class="text-center mt-1">
        <h2 class="title-lg">Tur Tamamlandı!</h2>
        <p id="summary-team-title" class="subtitle"></p>
      </div>
      <div class="panel text-center">
        <span class="label-muted">Bu Turda Kazanılan Net Puan</span>
        <p id="summary-net-score" class="score-large">+0</p>
      </div>
      <button id="btn-next-turn" class="btn btn-blue">Sonraki Tura Geç</button>
      <div class="panel history-panel">
        <div class="flex-between mb-1">
          <span class="label-muted">Oynanan Kelimeler:</span>
          <span class="label-muted text-xs">✏️ Değiştirmek için dokun</span>
        </div>
        <div id="summary-history-list" class="history-list"></div>
      </div>
    </div>

    <!-- 🏆 Oyun Sonu -->
    <div id="screen-gameover" class="screen hidden">
      <div class="text-center mt-2">
        <h2 class="title-lg">Oyun Bitti!</h2>
        <p id="gameover-winner-text" class="winner-text"></p>
      </div>
      <div class="panel score-final-panel">
        <div class="panel-title">FİNAL SKORLARI</div>
        <div id="gameover-scores" class="final-scores-list"></div>
      </div>
      <button id="btn-restart" class="btn btn-green mt-auto">Yeni Oyun Başlat</button>
    </div>
  </div>
</body>
</html>
